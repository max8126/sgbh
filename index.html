<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>阶位材料升级计算器</title>
    <style>
        :root {
            --primary-color: #2a8cff;
            --primary-dark: #1a7ae6;
            --secondary-color: #32d74b;
            --danger-color: #ff453a;
            --warning-color: #ff9f0a;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #8e8e93;
            --bg-primary: #ffffff;
            --bg-secondary: #f2f2f7;
            --bg-tertiary: #e5e5ea;
            --border-color: #c7c7cc;
            --card-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-md: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 136px; /* 80px原有 + 56px底部导航 */
            max-width: 100vw;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        /* 顶部标题栏 */
        .header {
            background-color: var(--bg-primary);
            padding: var(--spacing-lg) var(--spacing-md);
            margin-bottom: var(--spacing-md);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .header .subtitle {
            font-size: var(--font-size-sm);
            color: #7f8c8d;
        }

        /* ========== 兵种切换标签 ========== */
        .class-tabs {
            display: flex;
            gap: 0;
            margin-bottom: var(--spacing-md);
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }
        .class-tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            white-space: nowrap;
        }
        .class-tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 16px;
            right: 16px;
            height: 3px;
            border-radius: 3px 3px 0 0;
            background: transparent;
            transition: background 0.2s;
        }
        .class-tab.active {
            color: var(--primary-color);
        }
        .class-tab.active::after {
            background: var(--primary-color);
        }
        .class-tab.infantry.active { color: #2a8cff; }
        .class-tab.infantry.active::after { background: #2a8cff; }
        .class-tab.cavalry.active { color: #32d74b; }
        .class-tab.cavalry.active::after { background: #32d74b; }
        .class-tab.archer.active { color: #ff9f0a; }
        .class-tab.archer.active::after { background: #ff9f0a; }

        /* 兵种分组容器（合并后的卡片） */
        .class-group-card {
            display: none;
            background-color: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            box-shadow: var(--card-shadow);
            margin-bottom: var(--spacing-md);
        }
        .class-group-card.active {
            display: block;
        }

        /* 兵种分组标题 */
        .class-group-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px solid var(--border-color);
        }
        .class-group-header h2 {
            font-size: var(--font-size-md);
            font-weight: 600;
            flex: 1;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        .class-group-header.infantry h2 { color: #2a8cff; }
        .class-group-header.cavalry h2 { color: #32d74b; }
        .class-group-header.archer h2 { color: #ff9f0a; }
        .class-group-header .group-icon {
            font-size: 20px;
        }

        /* 角色行（合并后每个兵种下的角色行） */
        .character-row {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
        }
        .character-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

        /* 神兵选择行：移动端纵向堆叠，≥768px 横向排列；玉石行始终在其下方 */
        .weapon-line {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .character-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .character-name {
            font-size: var(--font-size-md);
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 等级选择器 - 简化动画，锁死宽度，修正箭头 */
        .level-selectors {
            display: flex;
            gap: var(--spacing-md);
            width: 100%;
            overflow: hidden;
        }

        .level-selector {
            flex: 1;
            min-width: 0 !important;
            max-width: calc(50% - var(--spacing-md)/2) !important;
            width: calc(50% - var(--spacing-md)/2) !important;
            overflow: hidden;
            position: relative;
        }

        .level-selector label {
            display: block;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
        }

        /* 修正箭头：垂直居中对齐，不再靠下 */
        .select-wrapper {
            width: 100% !important;
            height: 44px !important;
            overflow: hidden !important;
            position: relative;
        }

        .select-wrapper select {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            height: 100% !important;
            padding: 0 12px !important;
            font-size: var(--font-size-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            appearance: none !important;
            -webkit-appearance: none !important;
            resize: none !important;
            white-space: nowrap;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            box-sizing: border-box !important;
        }

        /* 下拉箭头：精准垂直居中，修正靠下问题 */
        .select-wrapper::after {
            content: '';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%); /* 精准居中，解决靠下问题 */
            width: 16px;
            height: 16px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-size: contain;
            pointer-events: none;
            z-index: 1;
        }

        .select-wrapper select:disabled {
            background-color: var(--bg-secondary);
            color: var(--text-tertiary);
            cursor: not-allowed;
        }

        /* 目标option仅保留可选项，不可选的直接不渲染 */
        .select-wrapper select option {
            width: 200px !important;
            max-width: 200px !important;
            min-width: 0 !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            padding: 8px 12px !important;
            font-size: var(--font-size-sm) !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        /* 浏览器兼容兜底 */
        @-moz-document url-prefix() {
            .select-wrapper select {
                text-indent: 0.01px;
                text-overflow: '';
                border: 1px solid var(--border-color) !important;
            }
        }

        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            .select-wrapper select {
                border: 1px solid var(--border-color) !important;
            }
            .select-wrapper select option {
                width: 200px !important;
            }
        }

        .char-status {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            margin-top: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-tertiary);
        }

        /* 材料输入区域 */
        .materials-input {
            background-color: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--card-shadow);
        }
        .materials-input .section-title {
            font-size: var(--font-size-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px solid var(--border-color);
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .material-item {
            display: flex;
            flex-direction: column;
        }

        .material-item label {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
        }

        .material-item input {
            padding: 10px 12px;
            font-size: var(--font-size-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .material-item input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* 活动币输入框 */
        .coin-input-row {
            margin-top: 16px;
        }
        .coin-input-row label {
            display: block;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
        }
        .coin-input-row input {
            width: 100%;
            padding: 12px;
            font-size: var(--font-size-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }
        .coin-input-row input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(42, 140, 255, 0.1);
        }

        /* 礼包设置 */
        .package-settings {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: var(--spacing-md);
            margin-top: var(--spacing-md);
        }

        .package-settings h4 {
            font-size: var(--font-size-md);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        /* 按钮组 */
        .button-group {
            position: fixed;
            bottom: 56px;
            left: 0;
            right: 0;
            background-color: var(--bg-primary);
            padding: var(--spacing-md);
            display: flex;
            gap: var(--spacing-md);
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
            z-index: 999;
        }
        .button-group button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }
        #calculate-all {
            background-color: #4a6fa5;
            color: white;
        }
        #calculate-all:active {
            background-color: #3a5a80;
            transform: translateY(2px);
        }
        #reset-all {
            flex: 0 0 auto;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        #reset-all:active { transform: translateY(2px); }
        /* 结果区域 */
        .results-section {
            background-color: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-top: var(--spacing-md);
            margin-bottom: 110px;
            box-shadow: var(--card-shadow);
        }
        .results-section .section-title {
            font-size: var(--font-size-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px solid var(--border-color);
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ========== 结果展示区 ========== */
        .result-summary {
            margin-bottom: var(--spacing-sm);
        }

        .result-item {
            margin-bottom: var(--spacing-lg);
        }
        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item h4 {
            font-size: var(--font-size-md);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 材料卡片行 */
        .material-cards {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .material-result-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            border-left: 4px solid #ddd;
        }
        .material-result-card.shortage {
            border-left-color: var(--danger-color);
            background: #fff5f5;
        }
        .material-result-card.enough {
            border-left-color: var(--secondary-color);
            background: #f5fff7;
        }

        .material-result-card .mrc-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .material-result-card .mrc-icon {
            font-size: 20px;
        }
        .material-result-card .mrc-name {
            font-size: var(--font-size-md);
            font-weight: 700;
            color: #2c3e50;
        }

        .material-result-card .mrc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .mrc-stat {
            text-align: center;
            padding: 8px 4px;
            background: white;
            border-radius: var(--radius-sm);
        }
        .mrc-stat .mrc-val {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.3;
        }
        .mrc-stat .mrc-val.highlight-red {
            color: var(--danger-color);
            font-size: 1.4rem;
        }
        .mrc-stat .mrc-val.highlight-green {
            color: var(--secondary-color);
        }
        .mrc-stat .mrc-label {
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        /* 缺口购买提示条 */
        .mrc-action {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mrc-action.need-buy {
            background: #fff0f0;
            color: #c0392b;
            border: 1px solid #f5c6cb;
        }
        .mrc-action.no-need {
            background: #f0fff4;
            color: #27ae60;
            border: 1px solid #c3e6cb;
        }

        /* 花销汇总卡片 */
        .cost-summary-card {
            background: linear-gradient(135deg, #4a6fa5, #3a5a80);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            color: white;
        }
        .cost-summary-card .cost-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-size: var(--font-size-sm);
        }
        .cost-summary-card .cost-row:last-child {
            border-bottom: none;
            font-size: var(--font-size-lg);
            font-weight: 700;
            margin-top: 4px;
            padding-top: 12px;
        }
        .cost-summary-card .cost-amount {
            font-weight: 700;
        }

        /* 角色明细小卡 */
        .char-detail-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .char-detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
        }
        .char-detail-item .cd-name {
            font-weight: 700;
            color: #2c3e50;
            min-width: 36px;
        }
        .char-detail-item .cd-path {
            color: var(--text-secondary);
            flex: 1;
        }
        .char-detail-item .cd-mats {
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--font-size-xs);
        }

        /* 响应式调整：锁死宽度，无额外动画 */
        @media (min-width: 768px) {
            .container {
                max-width: 768px;
                margin: 0 auto;
            }
            .weapon-line {
                flex-direction: row;
                align-items: center;
            }
            .level-selector {
                max-width: calc(50% - var(--spacing-md)/2) !important;
                width: calc(50% - var(--spacing-md)/2) !important;
            }
        }
        /* ========== 底部导航栏 ========== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            z-index: 1000;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .bottom-nav .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-tertiary);
            font-size: var(--font-size-xs);
            font-weight: 500;
            gap: 3px;
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-nav .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1;
        }
        .bottom-nav .nav-item.active {
            color: var(--primary-color);
        }
        .bottom-nav .nav-item.active .nav-icon {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部标题栏 -->
    <div class="header">
        <h1>阶位材料升级计算器</h1>
        <div class="subtitle">神兵进阶规划</div>
    </div>

    <!-- 兵种切换标签（由配置生成） -->
    <div class="class-tabs" id="class-tabs"></div>

    <!-- 神兵输入区域（由配置生成） -->
    <div class="characters-container" id="characters-container"></div>

    <!-- 材料输入区域（由配置生成） -->
    <!-- ① 已拥有材料（神兵材料、玉石材料各自成行） -->
    <div class="materials-input">
        <div class="section-title">🎒 已拥有材料</div>
        <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;">⚔️ 神兵材料</div>
        <div class="materials-grid" id="owned-materials-grid"></div>
        <div style="font-size:13px;font-weight:600;color:#27ae60;margin-bottom:8px;">🟢 玉石材料</div>
        <div class="materials-grid" id="owned-jade-grid"></div>
    </div>

    <!-- ② 材料售价与活动币 -->
    <div class="materials-input">
        <div class="section-title">🛒 材料售价与活动币</div>
        <div class="package-settings">
            <h4>礼包单价（每包数量 / 价格）</h4>
            <div id="package-settings-container"></div>
        </div>
        <div class="coin-input-row">
            <label for="total-activity-coin">💰 可用活动币</label>
            <input type="number" id="total-activity-coin" min="0" value="0" placeholder="输入可用活动币数量">
        </div>
    </div>

    <!-- 结果区域：移除淡入动画类 -->
    <div class="results-section" id="results-section">
        <div class="result-summary">
            <div class="section-title">📊 计算结果</div>
            <div id="total-result">
                <p style="color: var(--text-secondary); text-align: center;">请选择升级目标，结果将自动显示</p>
            </div>
        </div>
    </div>
</div>

<!-- 底部按钮组 -->
<div class="button-group">
    <button id="reset-all" type="button">🗑️ 重置</button>
    <button id="calculate-all">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        查看结果
    </button>
</div>

<script>
    /* =====================================================================
       配置区：新增「材料」或「单位」只需在下面的数组里加一项即可
       ---------------------------------------------------------------------
       · 新增单位：在 UNITS 里加一行 { id: 唯一数字, name: '名称', group: '兵种key' }
       · 新增材料：在 MATERIALS 里加一项，并提供每级消耗 cost:{ 等级:数量, ... }
       · 新增兵种：在 GROUPS 里加一项（注意：还需在上方 <style> 中补充该兵种配色）
       ===================================================================== */

    // 兵种分组（key 需与 <style> 中的配色类名一致）
    const GROUPS = [
        { key: 'infantry', name: '步兵', icon: '⚔️' },
        { key: 'cavalry',  name: '骑兵', icon: '🐴' },
        { key: 'archer',   name: '弓兵', icon: '🏹' },
    ];

    // 单位（神兵）列表 —— 每个单位一行；id 必须唯一
    const UNITS = [
        { id: 1, name: '虎头湛金枪', group: 'infantry' },
        { id: 2, name: '铜鎏金虎符', group: 'infantry' },
        { id: 3, name: '八面汉剑',   group: 'cavalry'  },
        { id: 4, name: '先锋印',     group: 'cavalry'  },
        { id: 5, name: '诸葛连弩',   group: 'archer'   },
        { id: 6, name: '照月珠',     group: 'archer'   },
        // 👉 在此新增单位，例如： { id: 7, name: '步3', group: 'infantry' },
    ];

    // 原始等级消耗表（紫檀木 / 精金 / 青金石）—— 已验证，请勿改动
    // 每行格式： 等级: [紫檀木, 精金, 青金石]
    const BASE_LEVEL_DATA = {
        1: [1000, 50, 0],
        2: [1500, 75, 0],
        3: [2000, 100, 0],
        4: [2500, 125, 0],
        5: [3000, 150, 0],
        6: [3500, 175, 0],
        7: [4000, 200, 0],
        8: [4500, 225, 0],
        9: [5000, 250, 0],
        10: [5500, 275, 0],
        11: [6000, 300, 150],
        12: [6500, 325, 160],
        13: [7000, 350, 170],
        14: [7500, 375, 180],
        15: [8000, 400, 180],
        16: [8500, 425, 190],
        17: [9000, 450, 200],
        18: [9500, 475, 200],
        19: [10000, 500, 210],
        20: [10500, 525, 220],
        21: [11000, 550, 220],
        22: [12000, 600, 230],
        23: [13000, 650, 250],
        24: [14000, 700, 260],
        25: [15000, 750, 270],
        26: [16000, 800, 280],
        27: [17000, 850, 290],
        28: [18000, 900, 300],
        29: [19000, 950, 300],
        30: [20000, 1000, 310],
        31: [21000, 1050, 320],
        32: [22000, 1100, 320],
        33: [23000, 1150, 320],
        34: [24000, 1200, 320],
        35: [25000, 1250, 330],
        36: [26000, 1300, 330],
        37: [27000, 1350, 340],
        38: [28000, 1400, 350],
        39: [29000, 1450, 360],
        40: [30000, 1500, 360],
        41: [31000, 1550, 360],
        42: [32000, 1600, 370],
        43: [33000, 1650, 380],
        44: [34000, 1700, 390],
        45: [35000, 1750, 390],
        46: [36000, 1800, 400],
        47: [37000, 1850, 410],
        48: [38000, 1900, 420],
        49: [39000, 1950, 430],
        50: [40000, 2000, 440]
    };

    // 由原始表按列生成 { 等级: 数量 } 映射，供下方材料引用
    function baseCost(col) {
        const out = {};
        for (const lv in BASE_LEVEL_DATA) out[lv] = BASE_LEVEL_DATA[lv][col];
        return out;
    }

    // 材料列表 —— 每种材料一项
    //   key             唯一标识（英文/拼音）
    //   name / icon     显示名称与图标
    //   defaultPkgSize  每个礼包包含的数量（界面可改）
    //   defaultPkgPrice 每个礼包价格 / 活动币（界面可改）
    //   cost            每级消耗 { 等级: 数量 }；未列出的等级按 0 计
    const MATERIALS = [
        { key: 'zitan',   name: '紫檀木', icon: '🪵', defaultPkgSize: 4, defaultPkgPrice: 1,  cost: baseCost(0) },
        { key: 'jingjin', name: '精金',   icon: '✨', defaultPkgSize: 1, defaultPkgPrice: 5,  cost: baseCost(1) },
        { key: 'qingjin', name: '青金石', icon: '💎', defaultPkgSize: 1, defaultPkgPrice: 15, cost: baseCost(2) },
        // 👉 在此新增材料，例如：
        // { key: 'huaxing', name: '化形石', icon: '🔶', defaultPkgSize: 1, defaultPkgPrice: 20,
        //   cost: { 21: 10, 22: 12, /* ... 每级消耗 ... */ 50: 80 } },
    ];

    const levelNameMap = {
        1: "绿1", 2: "绿2", 3: "绿3", 4: "绿4", 5: "绿5",
        6: "蓝1", 7: "蓝2", 8: "蓝3", 9: "蓝4", 10: "蓝5",
        11: "紫1", 12: "紫2", 13: "紫3", 14: "紫4", 15: "紫5",
        16: "紫6", 17: "紫7", 18: "紫8", 19: "紫9", 20: "紫10",
        21: "橙1", 22: "橙2", 23: "橙3", 24: "橙4", 25: "橙5",
        26: "橙6", 27: "橙7", 28: "橙8", 29: "橙9", 30: "橙10",
        31: "橙11", 32: "橙12", 33: "橙13", 34: "橙14", 35: "橙15",
        36: "橙16", 37: "橙17", 38: "橙18", 39: "橙19", 40: "橙20",
        41: "橙21", 42: "橙22", 43: "橙23", 44: "橙24", 45: "橙25",
        46: "橙26", 47: "橙27", 48: "橙28", 49: "橙29", 50: "橙30"
    };
    const MAX_LEVEL = 50;

    /* =====================================================================
       玉石系统（秘宝之一，与神兵并列；同样按兵种加成）
       ---------------------------------------------------------------------
       · 玉石与神兵无直接关联，界面上每个神兵下挂 JADE_SLOTS_PER_UNIT 个玉石槽
       · 等级 1~JADE_MAX_LEVEL（纯数字，无颜色）；所有玉石共用同一套消耗曲线
       · 材料：璞玉 / 琢玉刀（与神兵材料不同）
       · cost 数组为每级增量 [1→2, 2→3, ...]，均经官方计算器逐级核对
       ===================================================================== */
    const JADE_MAX_LEVEL = 20;      // 目前只做到 20 阶（数据已全部核实）；如需扩到更高，补齐 cost 数组即可
    const JADE_SLOTS_PER_UNIT = 4;  // 每个神兵下的玉石槽数

    // 把每级增量数组 [1→2, 2→3, ...] 转成 { 等级: 该级消耗 }（数组第 0 项 = 升到 2 级的消耗）
    function jadeCost(incArr) {
        const out = {};
        incArr.forEach((v, i) => { out[i + 2] = v; });
        return out;
    }

    const JADE_MATERIALS = [
        { key: 'puyu',      name: '璞玉',   icon: '🟢', defaultPkgSize: 1, defaultPkgPrice: 15,
          cost: jadeCost([12,14,16,18,20,24,28,32,36,50,60,70,80,90,100,140,180,220,260]) },
        { key: 'zhuoyudao', name: '琢玉刀', icon: '🔪', defaultPkgSize: 1, defaultPkgPrice: 75,
          cost: jadeCost([4,6,8,10,12,16,20,30,40,60,100,140,180,220,240,240,260,260,280]) },
    ];

    // ========== 界面生成 ==========
    // 生成兵种切换标签
    function buildTabs() {
        document.getElementById('class-tabs').innerHTML = GROUPS.map((g, i) =>
            `<button class="class-tab ${g.key}${i === 0 ? ' active' : ''}" data-group="${g.key}">${g.icon} ${g.name}</button>`
        ).join('');
    }

    // 生成各兵种的单位卡片（含每个神兵下的玉石槽）
    function buildUnitCards() {
        document.getElementById('characters-container').innerHTML = GROUPS.map((g, i) => {
            const rows = UNITS.filter(u => u.group === g.key).map(u => {
                return `
            <div class="character-row">
                <div class="weapon-line">
                <div class="character-row-header">
                    <div class="character-name">${u.name}</div>
                </div>
                <div class="level-selectors">
                    <div class="level-selector">
                        <label for="current-level-${u.id}">当前等级</label>
                        <div class="select-wrapper">
                            <select id="current-level-${u.id}" class="current-level-select"></select>
                        </div>
                    </div>
                    <div class="level-selector">
                        <label for="target-level-${u.id}">目标等级</label>
                        <div class="select-wrapper">
                            <select id="target-level-${u.id}" class="target-level-select" disabled></select>
                        </div>
                    </div>
                </div>
                <div class="char-status" id="char-status-${u.id}">
                    <div class="status-dot"></div>
                    <span id="status-text-${u.id}">请先选择当前等级</span>
                </div>
                </div>
                <div style="margin-top:10px;margin-left:4px;padding-left:14px;border-left:3px solid #2ecc71;">
                    <div style="font-size:13px;font-weight:600;color:#27ae60;margin-bottom:8px;">↳ 🟢 玉石 · ${JADE_SLOTS_PER_UNIT} 颗同级（1–${JADE_MAX_LEVEL}阶）</div>
                    <div class="level-selectors">
                        <div class="level-selector">
                            <label for="jade-current-${u.id}">玉石当前</label>
                            <div class="select-wrapper">
                                <select id="jade-current-${u.id}" class="jade-current-select"></select>
                            </div>
                        </div>
                        <div class="level-selector">
                            <label for="jade-target-${u.id}">玉石目标</label>
                            <div class="select-wrapper">
                                <select id="jade-target-${u.id}" class="jade-target-select" disabled></select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
            }).join('');
            return `
        <div class="class-group-card${i === 0 ? ' active' : ''}" data-group="${g.key}">
            <div class="class-group-header ${g.key}">
                <h2><span class="group-icon">${g.icon}</span>${g.name}</h2>
            </div>
            ${rows}
        </div>`;
        }).join('');
    }

    // 生成材料输入区
    //   ① 已拥有材料：神兵材料(owned-*) + 玉石材料(jade-owned-*) 合并到同一网格
    //   ② 材料售价：仅神兵材料有礼包(pkgsize-* / pkgprice-*)
    function buildMaterialInputs() {
        document.getElementById('owned-materials-grid').innerHTML = MATERIALS.map(m => `
            <div class="material-item">
                <label for="owned-${m.key}">已拥有${m.icon}${m.name}</label>
                <input type="number" id="owned-${m.key}" min="0" value="0">
            </div>`).join('');
        document.getElementById('owned-jade-grid').innerHTML = JADE_MATERIALS.map(m => `
            <div class="material-item">
                <label for="jade-owned-${m.key}">已拥有${m.icon}${m.name}</label>
                <input type="number" id="jade-owned-${m.key}" min="0" value="0">
            </div>`).join('');

        const pkgRow = m => `
            <div class="materials-grid">
                <div class="material-item">
                    <label for="pkgsize-${m.key}">${m.icon} ${m.name}礼包</label>
                    <input type="number" id="pkgsize-${m.key}" min="1" value="${m.defaultPkgSize}">
                </div>
                <div class="material-item">
                    <label for="pkgprice-${m.key}">礼包价格</label>
                    <input type="number" id="pkgprice-${m.key}" min="0" value="${m.defaultPkgPrice}">
                </div>
            </div>`;
        const subLabel = (txt, color) => `<div style="font-size:13px;font-weight:600;color:${color};margin:4px 0 8px;">${txt}</div>`;
        document.getElementById('package-settings-container').innerHTML =
            subLabel('⚔️ 神兵材料', 'var(--text-secondary)') + MATERIALS.map(pkgRow).join('') +
            subLabel('🟢 玉石材料', '#27ae60') + JADE_MATERIALS.map(pkgRow).join('');
    }

    // ========== 初始化页面 ==========
    document.addEventListener('DOMContentLoaded', () => {
        buildTabs();
        buildUnitCards();
        buildMaterialInputs();

        // 兵种标签切换
        document.querySelectorAll('.class-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const group = this.dataset.group;
                document.querySelectorAll('.class-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.class-group-card').forEach(card => {
                    card.classList.toggle('active', card.dataset.group === group);
                });
            });
        });

        // 初始化每个单位的等级选择器
        UNITS.forEach(u => initLevelSelectors(u.id));

        // 初始化每个神兵的玉石选择器（4 颗同级，仅一组当前/目标）
        UNITS.forEach(u => initJadeSelectors(u.id));

        // 结果已实时计算；此按钮改为「滚动到结果区」（并刷新一次以确保最新）
        document.getElementById('calculate-all').addEventListener('click', () => {
            calculateTotal();
            document.getElementById('results-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // 绑定当前等级变化事件
        document.querySelectorAll('.current-level-select').forEach(select => {
            select.addEventListener('change', function() {
                const charId = this.id.split('-')[2];
                updateTargetLevelOptions(charId);
                updateStatusText(charId);
            });
        });

        document.querySelectorAll('.target-level-select').forEach(select => {
            select.addEventListener('change', function() {
                const charId = this.id.split('-')[2];
                updateStatusText(charId);
            });
        });

        // 绑定玉石当前等级变化事件（id 格式: jade-current-{unitId}）
        document.querySelectorAll('.jade-current-select').forEach(select => {
            select.addEventListener('change', function() {
                const p = this.id.split('-');
                updateJadeTargetOptions(p[2]);
            });
        });

        // ---- 本地存储：恢复上次输入 → 变化时自动保存 → 重置按钮 ----
        restoreState();
        const container = document.querySelector('.container');
        // 任一输入变化 → 保存 + 实时重新计算
        const onFieldChange = () => { saveState(); calculateTotal(); };
        container.addEventListener('change', onFieldChange);
        container.addEventListener('input', onFieldChange);
        document.getElementById('reset-all').addEventListener('click', resetState);

        // 载入时先计算一次（基于已恢复的输入）
        calculateTotal();
    });

    // 初始化等级选择器
    function initLevelSelectors(charId) {
        const currentSelect = document.getElementById(`current-level-${charId}`);
        const targetSelect = document.getElementById(`target-level-${charId}`);

        currentSelect.innerHTML = '';
        targetSelect.innerHTML = '';

        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = '请选择';
        currentSelect.appendChild(emptyOption.cloneNode(true));
        targetSelect.appendChild(emptyOption);

        for (let level = 1; level <= MAX_LEVEL; level++) {
            const option = document.createElement('option');
            option.value = level;
            option.textContent = `${level}-${levelNameMap[level]}`;
            currentSelect.appendChild(option.cloneNode(true));
            targetSelect.appendChild(option);
        }

        currentSelect.value = '';
        targetSelect.value = '';
        targetSelect.disabled = true;
        updateStatusText(charId);
    }

    // 目标等级仅展示可选选项（≥当前等级）
    function updateTargetLevelOptions(charId) {
        const currentSelect = document.getElementById(`current-level-${charId}`);
        const targetSelect = document.getElementById(`target-level-${charId}`);
        const currentLevel = parseInt(currentSelect.value);

        if (!currentLevel) {
            targetSelect.disabled = true;
            targetSelect.innerHTML = '';
            const emptyOption = document.createElement('option');
            emptyOption.value = '';
            emptyOption.textContent = '请选择';
            targetSelect.appendChild(emptyOption);
            targetSelect.value = '';
            return;
        }

        targetSelect.disabled = false;
        targetSelect.innerHTML = '';

        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = '请选择';
        targetSelect.appendChild(emptyOption);

        for (let level = currentLevel; level <= MAX_LEVEL; level++) {
            const option = document.createElement('option');
            option.value = level;
            option.textContent = `${level}-${levelNameMap[level]}`;
            targetSelect.appendChild(option);
        }

        targetSelect.value = currentLevel;
    }

    // 更新状态文本
    function updateStatusText(charId) {
        const statusText = document.getElementById(`status-text-${charId}`);
        const currentSelect = document.getElementById(`current-level-${charId}`);
        const targetSelect = document.getElementById(`target-level-${charId}`);
        const currentLevel = parseInt(currentSelect.value);
        const targetLevel = parseInt(targetSelect.value);
        const statusDot = document.getElementById(`char-status-${charId}`).querySelector('.status-dot');

        if (!currentLevel) {
            statusText.textContent = "请先选择当前等级";
            statusDot.style.backgroundColor = "var(--warning-color)";
        } else {
            statusText.textContent = `${levelNameMap[currentLevel]} → ${levelNameMap[targetLevel]}`;
            statusDot.style.backgroundColor = "var(--secondary-color)";
        }
    }

    // 玉石选择器：初始化（当前/目标，1~JADE_MAX_LEVEL，空=不升级）
    function initJadeSelectors(uid) {
        const cur = document.getElementById(`jade-current-${uid}`);
        const tgt = document.getElementById(`jade-target-${uid}`);
        let curOpts = '<option value="">—</option>';
        for (let lv = 1; lv <= JADE_MAX_LEVEL; lv++) curOpts += `<option value="${lv}">${lv}阶</option>`;
        cur.innerHTML = curOpts;
        tgt.innerHTML = '<option value="">—</option>';
        cur.value = '';
        tgt.value = '';
        tgt.disabled = true;
    }

    // 玉石目标等级：仅展示 ≥ 当前等级的选项
    function updateJadeTargetOptions(uid) {
        const cur = document.getElementById(`jade-current-${uid}`);
        const tgt = document.getElementById(`jade-target-${uid}`);
        const c = parseInt(cur.value);
        if (!c) {
            tgt.disabled = true;
            tgt.innerHTML = '<option value="">—</option>';
            tgt.value = '';
            return;
        }
        tgt.disabled = false;
        let opts = '<option value="">—</option>';
        for (let lv = c; lv <= JADE_MAX_LEVEL; lv++) opts += `<option value="${lv}">${lv}阶</option>`;
        tgt.innerHTML = opts;
        tgt.value = c;
    }

    // ========== 计算总需求 ==========
    function calculateTotal() {
        const totalCoin = parseInt(document.getElementById('total-activity-coin').value) || 0;

        // ---- 神兵：逐单位累计各材料需求 ----
        const totals = {};
        MATERIALS.forEach(m => totals[m.key] = 0);
        const charDetails = [];

        UNITS.forEach(u => {
            const currentLevel = parseInt(document.getElementById(`current-level-${u.id}`).value);
            const targetLevel = parseInt(document.getElementById(`target-level-${u.id}`).value);

            if (!currentLevel || !targetLevel || currentLevel >= targetLevel) return;

            const per = {};
            MATERIALS.forEach(m => per[m.key] = 0);
            for (let level = currentLevel + 1; level <= targetLevel; level++) {
                MATERIALS.forEach(m => { per[m.key] += (m.cost[level] || 0); });
            }
            MATERIALS.forEach(m => totals[m.key] += per[m.key]);

            charDetails.push({
                id: u.id,
                name: u.name,
                currentLevel: currentLevel,
                targetLevel: targetLevel,
                per: per
            });
        });

        // ---- 神兵：逐材料计算缺口 / 礼包数 / 花费 ----
        let totalCost = 0;
        const matResults = MATERIALS.map(m => {
            const owned = parseInt(document.getElementById(`owned-${m.key}`).value) || 0;
            const pkgSize = parseInt(document.getElementById(`pkgsize-${m.key}`).value) || 1;
            const pkgPrice = parseInt(document.getElementById(`pkgprice-${m.key}`).value) || 0;
            const need = totals[m.key];
            const shortage = Math.max(0, need - owned);
            const packages = Math.ceil(shortage / pkgSize);
            const cost = packages * pkgPrice;
            totalCost += cost;
            return { m, owned, pkgSize, pkgPrice, need, shortage, packages, cost };
        });
        // ---- 玉石：每个神兵 4 颗同级，一组当前/目标 × JADE_SLOTS_PER_UNIT ----
        const jadeTotals = {};
        JADE_MATERIALS.forEach(m => jadeTotals[m.key] = 0);
        let jadeStoneCount = 0;
        UNITS.forEach(u => {
            const c = parseInt(document.getElementById(`jade-current-${u.id}`).value);
            const t = parseInt(document.getElementById(`jade-target-${u.id}`).value);
            if (!c || !t || c >= t) return;
            jadeStoneCount += JADE_SLOTS_PER_UNIT;
            for (let lv = c + 1; lv <= t; lv++) {
                JADE_MATERIALS.forEach(m => { jadeTotals[m.key] += (m.cost[lv] || 0) * JADE_SLOTS_PER_UNIT; });
            }
        });
        // 没有任何升级目标（神兵 / 玉石）时，显示提示而非全零结果
        if (charDetails.length === 0 && jadeStoneCount === 0) {
            document.getElementById('total-result').innerHTML =
                '<p style="color: var(--text-secondary); text-align: center;">请选择升级目标，结果将自动显示</p>';
            return;
        }

        const jadeResults = JADE_MATERIALS.map(m => {
            const owned = parseInt(document.getElementById(`jade-owned-${m.key}`).value) || 0;
            const pkgSize = parseInt(document.getElementById(`pkgsize-${m.key}`).value) || 1;
            const pkgPrice = parseInt(document.getElementById(`pkgprice-${m.key}`).value) || 0;
            const need = jadeTotals[m.key];
            const shortage = Math.max(0, need - owned);
            const packages = Math.ceil(shortage / pkgSize);
            const cost = packages * pkgPrice;
            totalCost += cost;
            return { m, owned, pkgSize, pkgPrice, need, shortage, packages, cost };
        });

        // 活动币结余（含神兵 + 玉石礼包花费）
        const coinSurplus = totalCoin - totalCost;

        // ---- 生成结果 HTML ----
        const targets = charDetails.map(c => `<strong>${c.name}</strong> ${levelNameMap[c.currentLevel]}→${levelNameMap[c.targetLevel]}`).join('　');

        const materialCards = matResults.map(r => `
                        <div class="material-result-card ${r.shortage > 0 ? 'shortage' : 'enough'}">
                            <div class="mrc-header">
                                <span class="mrc-icon">${r.m.icon}</span>
                                <span class="mrc-name">${r.m.name}</span>
                            </div>
                            <div class="mrc-grid">
                                <div class="mrc-stat">
                                    <div class="mrc-val">${formatNumber(r.need)}</div>
                                    <div class="mrc-label">需要</div>
                                </div>
                                <div class="mrc-stat">
                                    <div class="mrc-val">${formatNumber(r.owned)}</div>
                                    <div class="mrc-label">拥有</div>
                                </div>
                                <div class="mrc-stat">
                                    <div class="mrc-val ${r.shortage > 0 ? 'highlight-red' : 'highlight-green'}">${r.shortage > 0 ? formatNumber(r.shortage) : '✓'}</div>
                                    <div class="mrc-label">缺口</div>
                                </div>
                            </div>
                            ${r.shortage > 0 ? `<div class="mrc-action need-buy">⚠️ 需购买 <strong>${r.packages}</strong> 个礼包（${r.pkgSize}个/包）</div>` : `<div class="mrc-action no-need">✅ 材料充足，无需购买</div>`}
                        </div>`).join('');

        const costRows = [...matResults, ...jadeResults].filter(r => r.packages > 0).map(r =>
            `<div class="cost-row"><span>${r.m.icon} ${r.m.name}礼包</span><span class="cost-amount">${r.packages}个 × ${r.pkgPrice}币 = ${formatNumber(r.cost)} 活动币</span></div>`
        ).join('');

        let resultHTML = `
                <div class="result-item">
                    <h4>🎯 升级目标</h4>
                    <p style="font-size:14px;color:#555;line-height:1.8;">${targets || '无'}</p>
                </div>

                <div class="result-item">
                    <h4>📦 材料需求明细</h4>
                    <div class="material-cards">${materialCards}
                    </div>
                </div>
            `;

        if (charDetails.length > 0) {
            resultHTML += `
                    <div class="result-item">
                        <h4>👤 各角色明细</h4>
                        <div class="char-detail-list">
                `;
            charDetails.forEach(char => {
                const mats = MATERIALS.map(m => `${m.icon}${formatNumber(char.per[m.key])}`).join(' ');
                resultHTML += `
                        <div class="char-detail-item">
                            <span class="cd-name">${char.name}</span>
                            <span class="cd-path">${levelNameMap[char.currentLevel]} → ${levelNameMap[char.targetLevel]}</span>
                            <span class="cd-mats">${mats}</span>
                        </div>
                    `;
            });
            resultHTML += `
                        </div>
                    </div>
                `;
        }

        // ---- 玉石结果 ----
        if (jadeStoneCount > 0) {
            const jadeCards = jadeResults.map(r => `
                        <div class="material-result-card ${r.shortage > 0 ? 'shortage' : 'enough'}">
                            <div class="mrc-header">
                                <span class="mrc-icon">${r.m.icon}</span>
                                <span class="mrc-name">${r.m.name}</span>
                            </div>
                            <div class="mrc-grid">
                                <div class="mrc-stat">
                                    <div class="mrc-val">${formatNumber(r.need)}</div>
                                    <div class="mrc-label">需要</div>
                                </div>
                                <div class="mrc-stat">
                                    <div class="mrc-val">${formatNumber(r.owned)}</div>
                                    <div class="mrc-label">拥有</div>
                                </div>
                                <div class="mrc-stat">
                                    <div class="mrc-val ${r.shortage > 0 ? 'highlight-red' : 'highlight-green'}">${r.shortage > 0 ? formatNumber(r.shortage) : '✓'}</div>
                                    <div class="mrc-label">缺口</div>
                                </div>
                            </div>
                            ${r.shortage > 0 ? `<div class="mrc-action need-buy">⚠️ 需购买 <strong>${r.packages}</strong> 个礼包（${r.pkgSize}个/包）</div>` : `<div class="mrc-action no-need">✅ 材料充足，无需购买</div>`}
                        </div>`).join('');
            resultHTML += `
                    <div class="result-item">
                        <h4>🟢 玉石材料需求（共 ${jadeStoneCount} 颗）</h4>
                        <div class="material-cards">${jadeCards}
                        </div>
                    </div>
                `;
        }

        // ---- 礼包花费与活动币结余（最终结果，置于最底部）----
        resultHTML += `
                <div class="result-item">
                    <h4>💰 礼包花费合计（神兵 + 玉石）</h4>
                    <div class="cost-summary-card">
                        ${costRows}
                        <div class="cost-row"><span>📊 合计花费</span><span class="cost-amount">${formatNumber(totalCost)} 活动币</span></div>
                    </div>
                    <div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;text-align:center;">
                        <span style="font-size:14px;color:#555;">可用 <strong style="font-size:1.2rem;color:#2c3e50;">${formatNumber(totalCoin)}</strong> 活动币 →
                        ${coinSurplus >= 0
                            ? `<span style="color:#27ae60;font-weight:700;font-size:1.1rem;">剩余 ${formatNumber(coinSurplus)}</span> ✅`
                            : `<span style="color:#e74c3c;font-weight:700;font-size:1.1rem;">不足 ${formatNumber(Math.abs(coinSurplus))}</span> ❌`}
                        </span>
                    </div>
                </div>
            `;

        document.getElementById('total-result').innerHTML = resultHTML;
    }

    // 辅助函数：格式化数字（千分位）
    function formatNumber(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // ========== 本地存储（localStorage）：刷新后保留用户输入 ==========
    const STORAGE_KEY = 'sgbh-calc-state';

    // 收集容器内所有带 id 的 select / number 输入
    function persistFields() {
        return Array.from(document.querySelectorAll('.container select[id], .container input[id]'));
    }

    function saveState() {
        const state = {};
        persistFields().forEach(el => { state[el.id] = el.value; });
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* 隐私模式等，忽略 */ }
    }

    function restoreState() {
        let state = null;
        try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { state = null; }
        if (!state) return;

        // 1) 先恢复神兵「当前等级」并据此重建「目标等级」选项
        UNITS.forEach(u => {
            const cur = state[`current-level-${u.id}`];
            if (cur) {
                document.getElementById(`current-level-${u.id}`).value = cur;
                updateTargetLevelOptions(u.id);
            }
        });
        // 2) 再恢复神兵「目标等级」并刷新状态文本
        UNITS.forEach(u => {
            const tgt = state[`target-level-${u.id}`];
            if (tgt) document.getElementById(`target-level-${u.id}`).value = tgt;
            updateStatusText(u.id);
        });
        // 3) 玉石「当前」→重建「目标」选项→恢复「目标」
        UNITS.forEach(u => {
            const jc = state[`jade-current-${u.id}`];
            if (jc) {
                document.getElementById(`jade-current-${u.id}`).value = jc;
                updateJadeTargetOptions(u.id);
            }
        });
        UNITS.forEach(u => {
            const jt = state[`jade-target-${u.id}`];
            if (jt) document.getElementById(`jade-target-${u.id}`).value = jt;
        });
        // 4) 其余数字输入（已拥有 / 礼包 / 活动币）
        persistFields().forEach(el => {
            if (el.tagName === 'INPUT' && state[el.id] !== undefined) el.value = state[el.id];
        });
    }

    function resetState() {
        if (!confirm('确定要清空所有输入吗？')) return;
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* 忽略 */ }
        location.reload();
    }
</script>

        </a>

            <span class="nav-icon">🚗</span>
            <span>盟车抽取</span>
        </a>
